<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORCID Authentication - BooffIn</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #0d1117;
      color: #ffffff;
    }
    .card {
      text-align: center;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px 24px;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #A6CE39;
      color: white;
      font-size: 20px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    h2 {
      font-size: 18px;
      margin: 0 0 8px 0;
      color: #f0f6fc;
    }
    p {
      font-size: 14px;
      color: #8b949e;
      margin: 0;
      line-height: 1.5;
    }
    .spinner {
      margin-top: 20px;
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(166, 206, 57, 0.3);
      border-radius: 50%;
      border-top-color: #A6CE39;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">iD</div>
    <h2>ORCID Authentication Verified</h2>
    <p>Returning to BooffIn to complete your profile verification...</p>
    <div class="spinner"></div>
  </div>

  <script>
    (function () {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const code = urlParams.get('code') || hashParams.get('code');
        const orcid = urlParams.get('orcid') || hashParams.get('orcid');
        const error = urlParams.get('error') || hashParams.get('error');

        const authPayload = {
          type: 'ORCID_AUTH_SUCCESS',
          code: code || null,
          orcid: orcid || null,
          error: error || null,
          url: window.location.href,
          timestamp: Date.now()
        };

        // Notify parent window via postMessage
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(authPayload, '*');
        }

        // Also store in localStorage for cross-tab communication fallback
        try {
          localStorage.setItem('booffin_orcid_auth', JSON.stringify(authPayload));
        } catch (e) {}

        // Broadcast channel fallback
        if (typeof BroadcastChannel !== 'undefined') {
          try {
            const bc = new BroadcastChannel('booffin_orcid_channel');
            bc.postMessage(authPayload);
            bc.close();
          } catch (e) {}
        }

        // Close popup window after a brief delay
        setTimeout(function () {
          try {
            window.close();
          } catch (e) {}
        }, 800);
      } catch (err) {
        console.error('Error handling ORCID callback:', err);
      }
    })();
  </script>
</body>
</html>
